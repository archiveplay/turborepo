services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17

    ports:
      - "5432:5432"

    # Automatically restart after reboot or crash.
    restart: unless-stopped

    environment:
      # Passed as Linux environment variables.
      # PostgreSQL image reads these ONLY during first initialization.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app-db

    # Named Docker volume.
    # Even if the container is deleted, this volume survives.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Can reach postgres using: postgres:5432
    networks:
      - app_network

    # Wait until PostgreSQL accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5



  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    restart: unless-stopped

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5



  # ---------------------------------------------------------------------------
  # Nest API
  # ---------------------------------------------------------------------------
  api:
    # NOTE: provide .env variables (see .env.example)
    env_file:
      - ./apps/api/.env

    build:
      context: .

      dockerfile: ./apps/api/Dockerfile

      # Build-time variables.
      args:
        DATABASE_URL: ${DATABASE_URL}


    restart: unless-stopped

    # Don't start api until DB and Redis are healthy.
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    # Publish container port.
    ports:
      - "4000:4000"

    networks:
      - app_network


# Docker managed persistent storage.
volumes:
  postgres_data:


# Docker bridge network.
#
# Every service joins this network.
#
#    api
#     |
#  postgres
#     |
#   redis
#
# Containers resolve each other by service name.
#
# postgres
# redis
# api
#
networks:
  app_network:
