# ---------------------------------------------------------------------------
# Deployment stack.
#
# CONFIGURATION CONTRACT
#
# The root `.env` file is the single source of truth (see `.env.example`).
# Compose auto-loads it and interpolates the `${...}` references below:
#
#   ${VAR:?message}  required -> `docker compose up` aborts with `message`
#   ${VAR:-default}  optional -> falls back to `default`
#
# So a missing variable fails immediately, naming itself, before any container
# starts.
#
# The per-package env files (`apps/api/.env`, `packages/db/.env`,
# `packages/api/.env`) are for HOST tooling only (`pnpm dev`, prisma, orval).
# They point at `localhost` and are deliberately NOT read by any container:
# inside the network the hosts are `postgres` and `redis`, not `localhost`.
# ---------------------------------------------------------------------------

# Credentials are declared once (as parts) and the DSN is assembled here, so
# the compose file and the database container can never drift apart.
x-database-url: &database_url postgresql://${POSTGRES_USER:?required in .env}:${POSTGRES_PASSWORD:?required in .env}@postgres:5432/${POSTGRES_DB:?required in .env}

# Shared by `api` and `migrate` so both run the exact same image.
x-api-image: &api_image
  image: ${API_IMAGE:-archiveplay-api:latest}
  build:
    context: .
    dockerfile: ./apps/api/Dockerfile
  networks:
    - app_network

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17

    # Bound to loopback: reachable by host tooling (prisma/psql) but NOT
    # exposed on the VPS public interface.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    # Automatically restart after reboot or crash.
    restart: unless-stopped

    environment:
      # PostgreSQL image reads these ONLY during first initialization.
      # Changing them later does NOT change an existing volume.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Named Docker volume.
    # Even if the container is deleted, this volume survives.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Can reach postgres using: postgres:5432
    networks:
      - app_network

    # Wait until PostgreSQL accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    restart: unless-stopped

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Migrations (one-shot)
  #
  # Runs `prisma migrate deploy` and exits. The API waits for it to succeed, so
  # a deploy can never boot against an outdated schema.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *api_image

    working_dir: /app/packages/db

    command: ["node_modules/.bin/prisma", "migrate", "deploy"]

    environment:
      DATABASE_URL: *database_url

    depends_on:
      postgres:
        condition: service_healthy

    # One-shot task: never restart it.
    restart: "no"

  # ---------------------------------------------------------------------------
  # Nest API
  # ---------------------------------------------------------------------------
  api:
    <<: *api_image

    # Runtime configuration is mapped explicitly (no `env_file`) so that:
    #   - the container gets exactly the variables it needs, nothing else
    #   - secrets never leak into the postgres/redis containers
    #   - hostnames are container hostnames, not `localhost`
    environment:
      DATABASE_URL: *database_url
      REDIS_URL: redis://redis:6379

      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      CACHE_TTL: ${CACHE_TTL:-60000}
      CORS_ORIGINS: ${CORS_ORIGINS:?required in .env (e.g. https://your-domain.tld)}
      # Add app secrets here as `NAME: ${NAME:?required in .env}` so a missing
      # one aborts `docker compose up` instead of failing at runtime.

    restart: unless-stopped

    # Don't start api until DB and Redis are healthy and migrations applied.
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    # Bound to loopback: Caddy reaches this over the docker network (api:PORT),
    # this publish is only for host-side debugging (curl/psql-style access).
    ports:
      - "127.0.0.1:${API_PORT:-4000}:${PORT:-4000}"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/api-json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Nuxt SSR app (Nitro's node-server preset)
  #
  # Unlike the previous Vue SPA (nginx), Nuxt ships its own Node server, so
  # this container IS the app server. It's also the edge for the browser: it
  # serves pages AND reverse-proxies "/api" to the api service, so the app and
  # the API are same-origin and no CORS is involved. See
  # apps/nuxt/server/routes/api/[...].ts.
  # ---------------------------------------------------------------------------
  nuxt:
    image: ${NUXT_IMAGE:-archiveplay-nuxt:latest}

    build:
      context: .
      dockerfile: ./apps/nuxt/Dockerfile

    environment:
      # Nuxt's runtimeConfig picks this up at container startup (no rebuild
      # required, unlike Vite's build-time VITE_* vars) -- keeps the proxy
      # target pinned to the port the api container actually listens on. See
      # apps/nuxt/nuxt.config.ts (runtimeConfig.apiUpstream).
      NUXT_API_UPSTREAM: api:${PORT:-4000}

      NODE_ENV: production
      HOST: 0.0.0.0
      # Internal port the Nitro server listens on -- fixed, not host-configurable
      # (mirrors nginx always listening on a fixed internal 80 for web).
      PORT: 3000

    # Can reach the API using: api:4000
    networks:
      - app_network

    restart: unless-stopped

    # The proxy target must exist and answer before we accept browser traffic.
    depends_on:
      api:
        condition: service_healthy

    # Bound to loopback: Caddy reaches this over the docker network (nuxt:3000),
    # this publish is only for host-side debugging.
    ports:
      - "${NUXT_PORT:-3000}:3000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Caddy — public edge: terminates TLS for DOMAIN and forwards to `nuxt`.
  #
  # This is the ONLY service publicly reachable on 80/443. Certificates are
  # requested from Let's Encrypt automatically (HTTP-01 challenge on :80) and
  # renewed automatically -- DOMAIN must already point at this VPS. See
  # ./Caddyfile.
  # ---------------------------------------------------------------------------
  # caddy:
  #   image: caddy:2-alpine
  #
  #   environment:
  #     DOMAIN: ${DOMAIN:?required in .env (e.g. app.your-domain.tld, must already resolve to this VPS)}
  #
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     # Persisted so certificates survive container recreation -- without
  #     # this, every `up --force-recreate` would re-issue certs and could hit
  #     # Let's Encrypt's rate limits.
  #     - caddy_data:/data
  #     - caddy_config:/config
  #
  #   networks:
  #     - app_network
  #
  #   restart: unless-stopped
  #
  #   depends_on:
  #     nuxt:
  #       condition: service_healthy
  #
  #   ports:
  #     - "80:80"
  #     - "443:443"

# Docker managed persistent storage.
volumes:
  postgres_data:
  caddy_data:
  caddy_config:

# Docker bridge network.
#
# Every service joins this network.
#
#  browser -> caddy (:80/:443, TLS) -> nuxt (Nitro node server :3000)
#                                         |  proxies /api -> api:4000
#                                        api
#                                       /   \
#                                postgres    redis
#
# Containers resolve each other by service name.
#
# postgres
# redis
# api
# nuxt
# caddy
#
networks:
  app_network:
